<section class="products">
	<h2 class="section-title">Our Cosmic Creations</h2>
	<div class="carousel-container">
		<button
			class="carousel-button carousel-prev"
			aria-label="Previous"
		>
			<svg
				width="24"
				height="24"
				viewBox="0 0 24 24"
				fill="none"
				xmlns="http://www.w3.org/2000/svg"
			>
				<path
					d="M15 18L9 12L15 6"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
				/>
			</svg>
		</button>
		<div class="carousel">
			<div class="carousel-track">
				<div class="carousel-slide">
					<div class="product-image placeholder">
						<div class="placeholder-content">Star & Moon Cookies</div>
					</div>
				</div>
				<div class="carousel-slide">
					<div class="product-image placeholder">
						<div class="placeholder-content">Cupcakes</div>
					</div>
				</div>
				<div class="carousel-slide">
					<div class="product-image placeholder">
						<div class="placeholder-content">Multi-tiered Cake</div>
					</div>
				</div>
				<div class="carousel-slide">
					<div class="product-image placeholder">
						<div class="placeholder-content">More Cookies</div>
					</div>
				</div>
				<div class="carousel-slide">
					<div class="product-image placeholder">
						<div class="placeholder-content">Pastries</div>
					</div>
				</div>
			</div>
		</div>
		<button
			class="carousel-button carousel-next"
			aria-label="Next"
		>
			<svg
				width="24"
				height="24"
				viewBox="0 0 24 24"
				fill="none"
				xmlns="http://www.w3.org/2000/svg"
			>
				<path
					d="M9 18L15 12L9 6"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
				/>
			</svg>
		</button>
		<div class="carousel-dots">
			<button
				class="dot active"
				data-slide="0"
				aria-label="Slide 1"
			></button>
			<button
				class="dot"
				data-slide="1"
				aria-label="Slide 2"
			></button>
			<button
				class="dot"
				data-slide="2"
				aria-label="Slide 3"
			></button>
			<button
				class="dot"
				data-slide="3"
				aria-label="Slide 4"
			></button>
			<button
				class="dot"
				data-slide="4"
				aria-label="Slide 5"
			></button>
		</div>
	</div>
</section>
