<footer class="site-footer">
	<div class="footer-content">
		<div class="footer-section footer-logo">
			<img
				class="logo"
				src="/assets/images/logo-square.png"
				alt="Cosmic Charms Bakery Logo"
				class="logo-image"
			/>
		</div>

		<div class="footer-section footer-newsletter">
			<h3 class="footer-heading"><span class="star-icon">★</span> Join Our Newsletter</h3>
			<p class="newsletter-text">Stay updated on our latest treats and offers!</p>
			<script
				async
				src="https://subscribe-forms.beehiiv.com/embed.js"
			></script>
			<iframe
				src="https://subscribe-forms.beehiiv.com/b8607b24-5a54-4db7-9775-34df9b73d095"
				class="beehiiv-embed"
				data-test-id="beehiiv-embed"
				frameborder="0"
				scrolling="no"
				style="
					width: 560px;
					height: 252px;
					margin: 0;
					border-radius: 0px 0px 0px 0px !important;
					background-color: transparent;
					box-shadow: 0 0 #0000;
					max-width: 100%;
				"
			></iframe>
		</div>

		<div class="footer-section footer-links">
			<h3 class="footer-heading">Quick Links</h3>
			<ul class="footer-list">
				<li><a href="{{ '/' | relative_url }}">Home</a></li>
				<!-- <li><a href="{{ '/about' | relative_url }}">About</a></li>
				<li><a href="{{ '/menu' | relative_url }}">Menu</a></li>
				<li><a href="{{ '/contact' | relative_url }}">Contact</a></li> -->
			</ul>
		</div>

		<div class="footer-section footer-contact">
			<h3 class="footer-heading">Contact Us</h3>
			<ul class="footer-list">
				<li><a href="tel:{{ site.phone }}">{{ site.phone }}</a></li>
				<li><a href="tel:{{ site.phone }}">{{ site.phoneAlt }}</a></li>
				<li><a href="mailto:{{ site.email }}">{{ site.email }}</a></li>
				<li>{{ site.address }}</li>
			</ul>
		</div>

		<div class="footer-section footer-social">
			<h3 class="footer-heading">Follow Us</h3>
			<div class="social-icons">
				<a
					href="https://www.instagram.com/{{ site.social.instagram }}"
					class="social-icon"
					aria-label="Instagram"
				>
					<img
						class="social-icon-image"
						src="/assets/images/instagram.svg"
						alt="Instagram"
					/>
				</a>
			</div>
		</div>
	</div>

	<div class="footer-copyright">
		<p>&copy; 2025 Cosmic Charms Bakery. All rights reserved.</p>
	</div>
</footer>
