<header class="bg-base-100 text-base-content">
	<div class="navbar mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
		<div class="navbar-start">
			<a
				href="{{ '/' | relative_url }}"
				class="flex items-center gap-3"
			>
				<img
					src="{{ '/assets/images/logo.jpg' | relative_url }}"
					alt="{{ site.title }} logo"
					class="h-14 w-14 rounded-full object-cover shadow-soft"
					width="56"
					height="56"
				/>
				<span class="font-display text-lg font-semibold text-primary-purple sm:text-xl"> {{ site.title }} </span>
			</a>
		</div>

		<nav
			class="navbar-center hidden lg:flex"
			aria-label="Primary"
		>
			<ul class="menu menu-horizontal gap-1 px-1">
				{% for item in site.data.navigation %}
				<li>
					<a
						href="{{ item.path | relative_url }}"
						class="font-body text-sm font-medium text-navy-blue hover:bg-soft-lavender hover:text-primary-purple"
					>
						{{ item.label }}
					</a>
				</li>
				{% endfor %}
			</ul>
		</nav>

		<div class="navbar-end gap-1">
			<a
				href="{{ site.data.social.instagram }}"
				class="btn btn-ghost btn-circle"
				aria-label="Instagram"
				rel="noopener noreferrer"
				target="_blank"
			>
				<svg
					xmlns="http://www.w3.org/2000/svg"
					viewBox="0 0 24 24"
					fill="currentColor"
					class="h-5 w-5"
					aria-hidden="true"
				>
					<path
						d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm5 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm6.5-.75a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5zM12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"
					/>
				</svg>
			</a>
			<a
				href="{{ site.data.social.facebook }}"
				class="btn btn-ghost btn-circle"
				aria-label="Facebook"
				rel="noopener noreferrer"
				target="_blank"
			>
				<svg
					xmlns="http://www.w3.org/2000/svg"
					viewBox="0 0 24 24"
					fill="currentColor"
					class="h-5 w-5"
					aria-hidden="true"
				>
					<path
						d="M13.5 22v-8h2.7l.4-3.1h-3.1V8.9c0-.9.3-1.5 1.6-1.5H17V4.5c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.4H8v3.1h2.3V22h3.2z"
					/>
				</svg>
			</a>
		</div>
	</div>
</header>
