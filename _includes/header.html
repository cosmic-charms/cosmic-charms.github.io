<header class="site-header">
	<input
		type="checkbox"
		id="site-navigation-toggle"
		class="site-navigation__toggle visually-hidden"
	/>
	<nav
		class="site-navigation"
		aria-label="Primary Navigation"
	>
		<div class="site-navigation__bar">
			{% assign path = page.url | downcase %}
			<ul class="site-navigation__list">
				<li class="site-navigation__item site-navigation__item--home">
					<a
						href="{{ '/' | relative_url }}"
						class="site-navigation__link {% if path == '/' %}is-active{% endif %}"
					>
						<span class="site-navigation__link-text">Home</span>
					</a>
				</li>
				<li class="site-navigation__item site-navigation__item--catering">
					<a
						href="{{ '/catering-events/' | relative_url }}"
						class="site-navigation__link {% if path == '/catering-events.html' %}is-active{% endif %}"
					>
						<span class="site-navigation__link-text">Catering &amp; Events</span>
					</a>
				</li>
				<li class="site-navigation__item site-navigation__item--order-online">
					<a
						href="{{ '/order-online/' | relative_url }}"
						class="site-navigation__link {% if path == '/order-online.html' %}is-active{% endif %}"
					>
						<span class="site-navigation__link-text">Order Online</span>
					</a>
				</li>
				<li class="site-navigation__item site-navigation__item--contact">
					<a
						href="{{ '/contact/' | relative_url }}"
						class="site-navigation__link {% if path == '/contact.html' %}is-active{% endif %}"
					>
						<span class="site-navigation__link-text">Contact</span>
					</a>
				</li>
				<li class="site-navigation__item site-navigation__item--about">
					<a
						href="{{ '/about/' | relative_url }}"
						class="site-navigation__link {% if path == '/about.html' %}is-active{% endif %}"
					>
						<span class="site-navigation__link-text">About</span>
					</a>
				</li>
			</ul>
			<div class="site-navigation__hamburger-container">
				<label
					for="site-navigation-toggle"
					class="site-navigation__hamburger"
				>
					<span class="site-navigation__hamburger-line"></span>
					<span class="site-navigation__hamburger-line"></span>
					<span class="site-navigation__hamburger-line"></span>
					<span class="site-navigation__hamburger-label visually-hidden">Toggle menu</span>
				</label>
			</div>
		</div>

		<div class="site-navigation__drawer">
			<ul class="site-navigation__drawer-list">
				<li class="site-navigation__drawer-item site-navigation__drawer-item--order-online">
					<a
						href="{{ '/order-online/' | relative_url }}"
						class="site-navigation__link {% if path == '/order-online.html' %}is-active{% endif %}"
					>
						<span class="site-navigation__link-text">Order Online</span>
					</a>
				</li>
				<li class="site-navigation__drawer-item site-navigation__drawer-item--contact">
					<a
						href="{{ '/contact/' | relative_url }}"
						class="site-navigation__link {% if path == '/contact.html' %}is-active{% endif %}"
					>
						<span class="site-navigation__link-text">Contact</span>
					</a>
				</li>
				<li class="site-navigation__drawer-item site-navigation__drawer-item--about">
					<a
						href="{{ '/about/' | relative_url }}"
						class="site-navigation__link {% if path == '/about.html' %}is-active{% endif %}"
					>
						<span class="site-navigation__link-text">About</span>
					</a>
				</li>
			</ul>
		</div>
	</nav>
</header>
