<header class="site-header border-b border-lavender/60 bg-base-100/95 text-base-content backdrop-blur-sm">
	<div class="navbar mx-auto max-w-360 px-6 lg:px-10">
		<div class="navbar-start">
			<a
				href="{{ '/' | relative_url }}"
				class="shrink-0"
			>
				<img
					src="{{ '/assets/images/logo.jpg' | relative_url }}"
					alt="{{ site.title }} logo"
					class="h-16 w-16 rounded-full object-cover shadow-soft ring-2 ring-lavender/80 lg:h-18 lg:w-18"
					width="72"
					height="72"
				/>
			</a>
		</div>

		<nav
			class="navbar-center hidden lg:flex"
			aria-label="Primary"
		>
			<ul class="menu menu-horizontal gap-1 px-1">
				{% for item in site.data.navigation %} {% assign is_home = false %} {% if item.path == '/' and page.url == '/'
				%} {% assign is_home = true %} {% endif %}
				<li>
					<a
						href="{{ item.path | relative_url }}"
						class="font-display rounded-full px-4 py-2 text-[0.95rem] font-medium tracking-wide text-navy-blue transition {% if is_home %}bg-soft-lavender text-primary-purple{% else %}hover:bg-soft-lavender hover:text-primary-purple{% endif %}"
						{%
						if
						is_home
						%}aria-current="page"
						{%
						endif
						%}
					>
						{{ item.label }}
					</a>
				</li>
				{% endfor %}
			</ul>
		</nav>

		<div class="navbar-end gap-0.5 text-navy-blue">
			<a
				href="{{ site.data.social.cart | relative_url }}"
				class="btn btn-ghost btn-circle"
				aria-label="Shopping cart"
			>
				{% include icons/cart.html %}
			</a>
			<a
				href="{{ site.data.social.instagram }}"
				class="btn btn-ghost btn-circle"
				aria-label="Instagram"
				rel="noopener noreferrer"
				target="_blank"
			>
				{% include icons/instagram.html %}
			</a>
			<a
				href="{{ site.data.social.pinterest }}"
				class="btn btn-ghost btn-circle"
				aria-label="Pinterest"
				rel="noopener noreferrer"
				target="_blank"
			>
				{% include icons/pinterest.html %}
			</a>
		</div>
	</div>
</header>
