<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="{{ '/assets/favicon/apple-touch-icon.png' | relative_url }}	"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="{{ '/assets/favicon/favicon-32x32.png' | relative_url }}"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="{{ '/assets/favicon/favicon-16x16.png' | relative_url }}"
		/>
		<link
			rel="manifest"
			href="{{ '/assets/favicon/site.webmanifest' | relative_url }}"
		/>
		<link
			rel="stylesheet"
			href="{{ '/assets/css/base.css' | relative_url }}"
		/>
	</head>

	<body>
		{% include header.html %}

		<main>{{ content }}</main>

		{% include footer.html %}

		<!-- <script src="{{ '/assets/js/main.js' | relative_url }}"></script> -->
	</body>
</html>
