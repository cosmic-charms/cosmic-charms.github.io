name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      # CI/CD & GitHub metadata
      - '.github/**'

      # Documentation
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      
      # Tests & test fixtures
      - 'tests/**'
      - '__tests__/**'
      - '**/*.test.*'
      - '**/*.spec.*'
      
      # Local dev, editor, and linter configs
      - '.gitignore'
      - '.editorconfig'
      - '.prettierrc*'
      - '.eslintrc*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      upload_preview_artifact: false
      upload_pages_artifact: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
